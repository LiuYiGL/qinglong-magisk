<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>青龙 Qinglong</title>
<style>
  :root {
    --bg: #0d0f14;
    --card: #161a22;
    --card-2: #1d222c;
    --line: #2a3140;
    --text: #e8ecf3;
    --muted: #8d98aa;
    --accent: #2ea043;
    --accent-2: #58c46b;
    --ok: #3ddc97;
    --off: #6b7280;
    --danger: #f85149;
    --shadow: 0 14px 36px rgba(0, 0, 0, .35);
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6f8;
      --card: #ffffff;
      --card-2: #f6f8fa;
      --line: #d8dee4;
      --text: #1f2328;
      --muted: #656d76;
      --accent: #1a7f37;
      --accent-2: #2da44e;
      --ok: #1a7f37;
      --off: #8c959f;
      --danger: #cf222e;
      --shadow: 0 10px 28px rgba(140, 149, 159, .18);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
  }
  main { max-width: 680px; margin: 0 auto; }
  header { padding: 12px 4px 20px; }
  .brand {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent-2);
    font-weight: 700;
  }
  .brand-mark {
    width: 10px; height: 10px; border-radius: 3px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px rgba(46, 160, 67, .55);
  }
  h1 { margin: 10px 0 4px; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
  .sub { margin: 0; color: var(--muted); font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 12px;
  }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .status-row { gap: 10px; justify-content: flex-start; }
  .dot {
    width: 11px; height: 11px; border-radius: 50%; background: var(--off);
    flex: 0 0 auto; transition: background .2s, box-shadow .2s;
  }
  .dot.on { background: var(--ok); box-shadow: 0 0 12px rgba(61, 220, 151, .6); }
  .dot.off { background: var(--off); }
  #state { font-size: 17px; font-weight: 600; }
  .meta { color: var(--muted); font-size: 13px; margin-top: 8px; }
  .url-label { color: var(--muted); font-size: 12px; margin: 14px 0 6px; }
  code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .url {
    display: block; padding: 10px 12px; border-radius: 10px; background: var(--card-2);
    border: 1px solid var(--line); color: var(--accent-2); font-size: 12px;
    overflow-wrap: anywhere; user-select: all; -webkit-user-select: all;
  }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  button {
    appearance: none; border: 1px solid var(--line); background: var(--card-2);
    color: var(--text); border-radius: 12px; padding: 13px 14px;
    font-size: 14px; font-weight: 600; font-family: inherit;
    transition: transform .06s ease, border-color .15s, background .15s, opacity .15s;
  }
  button:active { transform: scale(.98); }
  button.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border-color: transparent; color: #fff;
  }
  button.small { padding: 7px 12px; font-size: 12px; border-radius: 9px; }
  button:disabled { opacity: .45; }
  .section-title { font-size: 13px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
  .hint { color: var(--muted); font-size: 12px; line-height: 1.5; margin: 10px 0 0; overflow-wrap: anywhere; }
  #logs {
    margin: 12px 0 0; padding: 12px; border-radius: 10px; background: #0b0d11;
    border: 1px solid var(--line); color: #b9c4d4; font-size: 11px; line-height: 1.5;
    max-height: 280px; overflow: auto; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  @media (prefers-color-scheme: light) {
    #logs { background: #f6f8fa; color: #3d444d; }
  }
  .foot { color: var(--muted); font-size: 11px; line-height: 1.6; text-align: center; padding: 8px 12px 0; }
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: #262c38; color: var(--text); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 16px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s; max-width: 86vw;
    z-index: 20;
  }
  @media (prefers-color-scheme: light) {
    .toast { background: #ffffff; }
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<main>
  <header>
    <div class="brand"><span class="brand-mark"></span>QINGLONG</div>
    <h1>青龙 Qinglong</h1>
    <p class="sub">Android 离线模块 · KernelSU WebUI</p>
  </header>

  <section class="card">
    <div class="row status-row">
      <span id="dot" class="dot off"></span>
      <span id="state">读取中…</span>
    </div>
    <div class="meta">模块 <span id="moduleVer">—</span> · 面板端口 <span id="port">—</span></div>
    <div class="url-label">面板地址</div>
    <code id="panelUrl" class="url">—</code>
  </section>

  <section class="card grid">
    <button id="btnStart">启动服务</button>
    <button id="btnStop">停止服务</button>
    <button id="btnRestart">重启服务</button>
    <button id="btnOpen" class="primary">进入面板</button>
  </section>

  <section class="card">
    <div class="row">
      <span class="section-title">运行日志</span>
      <button id="btnLogs" class="small">刷新</button>
    </div>
    <pre id="logs">点击“刷新”查看最近日志</pre>
  </section>

  <p class="foot">作者 Liuyi</p>
</main>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  var MOD_DIR = '/data/adb/modules/qinglong';
  var QL = MOD_DIR + '/bin/ql.sh';
  var LOG_FILE = '/data/adb/qinglong/logs/qinglong.log';
  var port = '5700';
  var runningState = null;
  var busy = false;

  function $(id) { return document.getElementById(id); }

  function hasApi() {
    return !!(window.ksu && typeof window.ksu.exec === 'function');
  }

  function notify(message) {
    try {
      if (hasApi() && typeof window.ksu.toast === 'function') {
        window.ksu.toast(String(message));
      }
    } catch (e) { /* ignore */ }
    var el = $('toast');
    if (!el) return;
    el.textContent = String(message);
    el.className = 'toast show';
    clearTimeout(el._timer);
    el._timer = setTimeout(function () { el.className = 'toast'; }, 2200);
  }

  function kexec(command) {
    return new Promise(function (resolve, reject) {
      if (!hasApi()) {
        reject(new Error('KernelSU WebUI API is not available'));
        return;
      }
      var name = 'ql_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      var settled = false;
      window[name] = function (errno, stdout, stderr) {
        if (settled) return;
        settled = true;
        try { delete window[name]; } catch (e) { /* ignore */ }
        resolve({ errno: errno, stdout: stdout || '', stderr: stderr || '' });
      };
      try {
        window.ksu.exec(command, '{}', name);
      } catch (e) {
        settled = true;
        try { delete window[name]; } catch (e2) { /* ignore */ }
        reject(e);
      }
    });
  }

  function run(command) {
    return kexec(command).then(function (result) {
      if (result && result.errno !== 0 && result.stderr) {
        notify(String(result.stderr).trim().slice(0, 180));
      }
      return result || { errno: -1, stdout: '', stderr: '' };
    });
  }

  function setBusy(value) {
    busy = value;
    ['btnStart', 'btnStop', 'btnRestart', 'btnOpen', 'btnLogs'].forEach(function (id) {
      var el = $(id);
      if (el) el.disabled = value;
    });
  }

  function refresh(silent) {
    return Promise.resolve().then(function () {
      return run('sh ' + QL + ' port');
    }).then(function (result) {
      var p = String(result.stdout || '').trim();
      if (/^[0-9]+$/.test(p)) port = p;
      $('port').textContent = port;
      $('panelUrl').textContent = 'http://127.0.0.1:' + port + '/';
      return run('sh ' + QL + ' status');
    }).then(function (result) {
      var running = String(result.stdout || '').indexOf('运行中') !== -1;
      runningState = running;
      $('dot').className = 'dot ' + (running ? 'on' : 'off');
      $('state').textContent = running ? '运行中' : '已停止';
      return run("sed -n 's/^version=//p' " + MOD_DIR + '/module.prop');
    }).then(function (result) {
      var v = String(result.stdout || '').trim();
      $('moduleVer').textContent = v || '—';
    }).catch(function (error) {
      if (!silent) notify(String(error).slice(0, 180));
    });
  }

  function waitUntilRunning(timeoutMs) {
    var started = Date.now();
    function step() {
      if (Date.now() - started >= timeoutMs) return Promise.resolve(false);
      return run('sh ' + QL + ' status').then(function (result) {
        if (String(result.stdout || '').indexOf('运行中') !== -1) return true;
        return new Promise(function (resolve) { setTimeout(resolve, 1500); }).then(step);
      });
    }
    return step();
  }

  function navigate(url) {
    try { history.pushState({ qinglongPanel: 1 }, '', location.href); } catch (e) { /* ignore */ }
    window.location.href = url;
  }

  function enterPanel() {
    if (!hasApi() || runningState === null) {
      navigate('http://127.0.0.1:' + port + '/');
      return;
    }
    if (!runningState) {
      notify('青龙未运行，请先启动服务');
      return;
    }
    navigate('http://127.0.0.1:' + port + '/');
  }

  function action(fn) {
    if (busy) return;
    setBusy(true);
    Promise.resolve().then(fn).catch(function (error) {
      notify(String(error).slice(0, 180));
    }).then(function () {
      return refresh(true);
    }).then(function () {
      setBusy(false);
    });
  }

  function loadLogs() {
    if (!hasApi()) return Promise.resolve();
    return run('tail -n 80 ' + LOG_FILE + ' 2>/dev/null').then(function (result) {
      var text = String(result.stdout || '').trim();
      $('logs').textContent = text || '暂无日志';
      $('logs').scrollTop = $('logs').scrollHeight;
    }).catch(function (error) {
      $('logs').textContent = '读取日志失败: ' + error.message;
    });
  }

  function bind() {
    $('btnStart').addEventListener('click', function () {
      action(function () {
        notify('正在启动服务…');
        return run('sh ' + QL + ' start').then(function () {
          return waitUntilRunning(60000);
        }).then(function (ok) {
          notify(ok ? '青龙已启动' : '仍在启动，请稍后刷新');
          return loadLogs();
        });
      });
    });

    $('btnStop').addEventListener('click', function () {
      action(function () {
        return run('sh ' + QL + ' stop').then(function () {
          notify('青龙已停止');
          return loadLogs();
        });
      });
    });

    $('btnRestart').addEventListener('click', function () {
      action(function () {
        notify('正在重启服务…');
        return run('sh ' + QL + ' restart').then(function () {
          return waitUntilRunning(60000);
        }).then(function (ok) {
          notify(ok ? '青龙已重启' : '仍在启动，请稍后刷新');
          return loadLogs();
        });
      });
    });

    $('btnOpen').addEventListener('click', enterPanel);
    $('btnLogs').addEventListener('click', loadLogs);

    document.addEventListener('visibilitychange', function () {
      if (!document.hidden) refresh(true);
    });
  }

  function init() {
    bind();
    if (!hasApi()) {
      notify('请在 KernelSU 管理器的模块 WebUI 中打开');
      setBusy(false);
      ['btnStart', 'btnStop', 'btnRestart', 'btnLogs'].forEach(function (id) {
        var el = $(id);
        if (el) el.disabled = true;
      });
      $('state').textContent = 'WebUI API 不可用';
      $('panelUrl').textContent = 'http://127.0.0.1:' + port + '/';
      $('port').textContent = port;
      return;
    }
    refresh(true).then(loadLogs);
    setInterval(function () { refresh(true); }, 15000);
  }

  init();
})();
</script>
</body>
</html>
